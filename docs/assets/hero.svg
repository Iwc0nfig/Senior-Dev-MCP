<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="t d">
  <title id="t">Senior-Dev-MCP</title>
  <desc id="d">A senior developer for your AI agent: it knows your legacy .NET code and your SQL Server database.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1a1036"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
      <animate attributeName="x1" values="0;-1;0" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;2;1" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="orbA"><stop offset="0" stop-color="#38bdf8" stop-opacity=".55"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbB"><stop offset="0" stop-color="#a855f7" stop-opacity=".5"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="orbC"><stop offset="0" stop-color="#f472b6" stop-opacity=".35"/><stop offset="1" stop-color="#f472b6" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".04"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="380" rx="18"/></clipPath>
    <clipPath id="typeClip">
      <rect x="44" y="0" height="60" width="0">
        <animate attributeName="width" values="0;0;600;600" keyTimes="0;0.08;0.55;1" dur="9s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .chip { animation: float 6s ease-in-out infinite; }
      .chip:nth-of-type(2) { animation-delay: -1.2s; }
      .chip:nth-of-type(3) { animation-delay: -2.4s; }
      .chip:nth-of-type(4) { animation-delay: -3.6s; }
      .chip:nth-of-type(5) { animation-delay: -4.8s; }
      .chip:nth-of-type(6) { animation-delay: -0.6s; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes pulse { 0%,100% { opacity: .35; transform: scale(1); } 50% { opacity: 1; transform: scale(1.35); } }
    </style>
  </defs>

  <g clip-path="url(#card)">
  <rect width="1200" height="380" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="380" rx="18" fill="url(#grid)"/>

  <circle cx="160" cy="80" r="220" fill="url(#orbA)">
    <animate attributeName="cx" values="160;260;160" dur="14s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1040" cy="300" r="260" fill="url(#orbB)">
    <animate attributeName="cy" values="300;220;300" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="760" cy="40" r="180" fill="url(#orbC)">
    <animate attributeName="cx" values="760;660;760" dur="16s" repeatCount="indefinite"/>
  </circle>

  <!-- floating tech chips -->
  <g class="mono" font-size="15" font-weight="600">
    <g class="chip"><rect x="830" y="70" rx="14" width="96" height="30" fill="#0ea5e9" fill-opacity=".16" stroke="#38bdf8" stroke-opacity=".6"/><text x="878" y="90" text-anchor="middle" fill="#bae6fd">C#</text></g>
    <g class="chip"><rect x="950" y="112" rx="14" width="118" height="30" fill="#a855f7" fill-opacity=".16" stroke="#c084fc" stroke-opacity=".6"/><text x="1009" y="132" text-anchor="middle" fill="#e9d5ff">WebForms</text></g>
    <g class="chip"><rect x="870" y="160" rx="14" width="100" height="30" fill="#22c55e" fill-opacity=".14" stroke="#4ade80" stroke-opacity=".6"/><text x="920" y="180" text-anchor="middle" fill="#bbf7d0">T-SQL</text></g>
    <g class="chip"><rect x="992" y="208" rx="14" width="96" height="30" fill="#f59e0b" fill-opacity=".14" stroke="#fbbf24" stroke-opacity=".6"/><text x="1040" y="228" text-anchor="middle" fill="#fde68a">Roslyn</text></g>
    <g class="chip"><rect x="850" y="252" rx="14" width="110" height="30" fill="#ec4899" fill-opacity=".14" stroke="#f472b6" stroke-opacity=".6"/><text x="905" y="272" text-anchor="middle" fill="#fbcfe8">.NET 8</text></g>
    <g class="chip"><rect x="1000" y="296" rx="14" width="80" height="30" fill="#14b8a6" fill-opacity=".14" stroke="#2dd4bf" stroke-opacity=".6"/><text x="1040" y="316" text-anchor="middle" fill="#99f6e4">MCP</text></g>
  </g>

  <!-- logo mark -->
  <g transform="translate(70 92)">
    <rect width="76" height="76" rx="20" fill="#0f172a" stroke="url(#title)" stroke-width="3"/>
    <text x="38" y="50" text-anchor="middle" class="mono" font-size="30" font-weight="800" fill="url(#title)">&lt;/&gt;</text>
    <circle cx="68" cy="10" r="7" fill="#4ade80" class="pulse"/>
  </g>

  <text x="168" y="128" class="sans" font-size="58" font-weight="800" fill="url(#title)" letter-spacing="-1">Senior-Dev-MCP</text>
  <text x="170" y="164" class="sans" font-size="20" fill="#cbd5e1">The senior developer your AI agent was missing.</text>

  <!-- typed tagline -->
  <g transform="translate(70 214)">
    <rect width="720" height="56" rx="12" fill="#020617" fill-opacity=".7" stroke="#334155"/>
    <text x="20" y="35" class="mono" font-size="17" fill="#64748b">❯</text>
    <g clip-path="url(#typeClip)">
      <text x="44" y="35" class="mono" font-size="17" fill="#e2e8f0">knows your legacy .NET code <tspan fill="#c084fc">+</tspan> your SQL Server DB <tspan fill="#4ade80">✔ cited</tspan></text>
    </g>
    <rect x="44" y="18" width="10" height="22" fill="#a78bfa" class="cursor">
      <animate attributeName="x" values="44;44;644;644" keyTimes="0;0.08;0.55;1" dur="9s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="70" y="318" class="sans" font-size="16" fill="#94a3b8">🔒 Read-only by design  ·  📌 A citation for every claim  ·  🧪 Tested in a sandbox clone, always rolled back</text>
  </g>
</svg>
