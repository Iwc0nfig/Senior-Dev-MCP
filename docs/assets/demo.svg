<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640" role="img" aria-labelledby="t d">
  <title id="t">Senior-Dev-MCP demo</title>
  <desc id="d">An AI agent fixes a fictional ticket with the code and DB advisors: it traces the report, decodes the column, reads the C#, drafts the change, validates it and tests it in a sandbox clone.</desc>
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#38bdf8"/><stop offset=".5" stop-color="#a78bfa"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <style>
      text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; font-size: 15px; }
      .bar { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 13px; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
    </style>
  </defs>
  <rect x="1.5" y="1.5" width="1097" height="637" rx="16" fill="#0b1020" stroke="url(#frame)" stroke-width="3"/>
  <rect x="3" y="3" width="1094" height="44" rx="14" fill="#111827"/>
  <rect x="3" y="33" width="1094" height="14" fill="#111827"/>
  <circle cx="30" cy="25" r="7" fill="#ef4444"/><circle cx="54" cy="25" r="7" fill="#f59e0b"/><circle cx="78" cy="25" r="7" fill="#22c55e"/>
  <text x="550" y="30" text-anchor="middle" class="bar" fill="#94a3b8">agent  ·  connected: senior-dev-code :8400  ·  senior-dev-db :8401</text>
  <line x1="3" y1="47" x2="1097" y2="47" stroke="#1f2937"/>
  <text x="36" y="96" opacity="0" xml:space="preserve"><tspan fill="#64748b">❯ </tspan><tspan fill="#fbbf24" font-weight="700">Ticket #12345: </tspan><tspan fill="#e2e8f0">the monthly revenue report doesn't match the invoice screen. Find out why and fix it.</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0300;0.0425;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="36" y="126" opacity="0" xml:space="preserve"><tspan fill="#c084fc">● </tspan><tspan fill="#c084fc" font-weight="700">senior-dev-db</tspan><tspan fill="#e2e8f0">  trace_screen("Monthly Revenue Report")</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1200;0.1325;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="60" y="156" opacity="0" xml:space="preserve"><tspan fill="#94a3b8">↳ report → dbo.usp_rpt_monthly_revenue · registered on 2 sides</tspan><tspan fill="#64748b">   sql-parse · exact</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.1500;0.1625;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="36" y="186" opacity="0" xml:space="preserve"><tspan fill="#c084fc">● </tspan><tspan fill="#c084fc" font-weight="700">senior-dev-db</tspan><tspan fill="#e2e8f0">  describe_column("OrderTable.NetAmount")</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2100;0.2225;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="60" y="216" opacity="0" xml:space="preserve"><tspan fill="#94a3b8">↳ NetAmount = order currency · NetAmountLocal = system currency → the one to sum</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2400;0.2525;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="60" y="246" opacity="0" xml:space="preserve"><tspan fill="#64748b">   curated · citation-verified</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2600;0.2725;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="36" y="276" opacity="0" xml:space="preserve"><tspan fill="#38bdf8">● </tspan><tspan fill="#38bdf8" font-weight="700">senior-dev-code</tspan><tspan fill="#e2e8f0">  read_file_range(at="Legacy/App/ui/invoices/Invoice.aspx.cs:142")</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3200;0.3325;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="60" y="306" opacity="0" xml:space="preserve"><tspan fill="#94a3b8">↳ InvoicePage.BindTotals() sums NetAmountLocal</tspan><tspan fill="#64748b">   roslyn-index · compiler-exact</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.3500;0.3625;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="36" y="336" opacity="0" xml:space="preserve"><tspan fill="#c084fc">● </tspan><tspan fill="#c084fc" font-weight="700">senior-dev-db</tspan><tspan fill="#e2e8f0">  get_impact("usp_rpt_monthly_revenue")</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4100;0.4225;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="60" y="366" opacity="0" xml:space="preserve"><tspan fill="#94a3b8">↳ 1 report, 0 SQL readers, 2 C# call sites</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4400;0.4525;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="36" y="396" opacity="0" xml:space="preserve"><tspan fill="#c084fc">● </tspan><tspan fill="#c084fc" font-weight="700">senior-dev-db</tspan><tspan fill="#e2e8f0">  draft_change(…, 1 anchored edit)  →  validate_sql(draft_id)</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5125;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="60" y="426" opacity="0" xml:space="preserve"><tspan fill="#94a3b8">↳ </tspan><tspan fill="#4ade80">✔ compiles</tspan><tspan fill="#94a3b8">   </tspan><tspan fill="#4ade80">✔ house style</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5300;0.5425;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="36" y="456" opacity="0" xml:space="preserve"><tspan fill="#c084fc">● </tspan><tspan fill="#c084fc" font-weight="700">senior-dev-db</tspan><tspan fill="#e2e8f0">  test_sql(draft_id, from_live="select … where Month = '2026-09'")</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5900;0.6025;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="60" y="486" opacity="0" xml:space="preserve"><tspan fill="#94a3b8">↳ </tspan><tspan fill="#4ade80">✔ 3 rows · totals now match the invoices</tspan><tspan fill="#64748b">   sandbox clone · rolled back</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6200;0.6325;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="36" y="531" opacity="0" xml:space="preserve"><tspan fill="#4ade80" font-weight="700">✅ Root cause: </tspan><tspan fill="#e2e8f0">the report sums NetAmount (mixed currencies) instead of NetAmountLocal.</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6900;0.7025;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <text x="36" y="561" opacity="0" xml:space="preserve"><tspan fill="#e2e8f0">   Diff + full script ready · </tspan><tspan fill="#f472b6" font-weight="700">6 citations</tspan><tspan fill="#e2e8f0"> · tested in the clone · </tspan><tspan fill="#4ade80" font-weight="700">production untouched</tspan><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7250;0.7375;0.8750;0.9050;1" dur="20.0s" repeatCount="indefinite"/></text>
  <rect x="36" y="578" width="9" height="18" fill="#a78bfa" class="cursor"/>
</svg>
