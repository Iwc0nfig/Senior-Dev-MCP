[project]
name = "senior-dev-db"
version = "0.1.0"
description = "Read-only, grounded MCP advisor for a SQL Server database, linked to the codebase (part of Senior-Dev-MCP)."
requires-python = ">=3.12"
dependencies = [
  "mcp>=2.1.1,<3",
  "pydantic>=2.9",
  "pyodbc>=5.0",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
senior-dev-db = "senior_dev_db.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/senior_dev_db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs the live database", "sandbox: needs the sandbox clone (scripts/sandbox.ps1)"]
